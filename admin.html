<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — Viharasetu</title>
<link rel="icon" type="image/png" href="images/fevicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * , *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #F4F1EA;
    --sidebar: #22201B;
    --sidebar-hover: #2E2B24;
    --ink: #26221C;
    --ink-soft: #5C554A;
    --accent: #BB5A34;
    --accent-dark: #9C4826;
    --card: #FFFFFF;
    --line: #E4DECF;
    --gold: #B8913F;
    --jade: #2A5C45;
    --red: #b3261e;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }
  h1, h2 { font-family: 'Playfair Display', serif; margin: 0; }
  a { color: inherit; }

  /* ── Login gate ── */
  #gate {
    position: fixed; inset: 0; z-index: 400;
    background: var(--sidebar);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #gate.hidden { display: none; }
  .gate-box {
    background: var(--card);
    border-radius: 18px;
    padding: 44px 36px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 30px 70px rgba(0,0,0,0.35);
  }
  .gate-logo { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; display: block; box-shadow: 0 8px 20px rgba(38,34,28,0.18); cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; }
  .gate-logo:hover { transform: scale(1.06); box-shadow: 0 10px 26px rgba(38,34,28,0.24); }
  .gate-box h1 { font-size: 24px; margin-bottom: 6px; }
  .gate-box p { color: var(--ink-soft); font-size: 14px; margin: 0 0 22px; }
  .gate-box input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 12px;
    font-family: inherit;
  }
  .gate-box input:focus { outline: none; border-color: var(--accent); }
  .gate-pw-wrap { position: relative; }
  .gate-pw-wrap input { padding-right: 42px; }
  .gate-box button.gate-pw-toggle {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink-soft);
    padding: 0;
    box-shadow: none;
    font-weight: normal;
  }
  .gate-box button.gate-pw-toggle:hover { background: rgba(187,90,52,0.1); color: var(--accent); transform: translateY(-50%); box-shadow: none; }
  .gate-pw-toggle svg { width: 19px; height: 19px; }
  .gate-box button {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 8px 20px rgba(187,90,52,0.3);
  }
  .gate-box button:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(187,90,52,0.4); }
  .gate-error { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 16px; }

  /* ── Shell layout ── */
  #app { display: none; min-height: 100vh; }
  #app.visible { display: flex; }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--sidebar);
    color: rgba(244,241,234,0.85);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 100;
    transition: transform .3s ease;
  }
  .sidebar-brand {
    display: flex; align-items: center; gap: 10px;
    padding: 22px 20px 18px;
    border-bottom: 1px solid rgba(244,241,234,0.1);
  }
  .sidebar-brand img { width: 38px; height: 38px; border-radius: 50%; }
  .sidebar-brand .name { font-family: 'Playfair Display', serif; font-size: 16px; color: #fff; line-height: 1.2; }
  .sidebar-brand .sub { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }

  .sidebar-nav { flex: 1; padding: 14px 12px; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    color: rgba(244,241,234,0.65);
    transition: background .15s ease, color .15s ease;
    margin-bottom: 2px;
    user-select: none;
  }
  .nav-item .ic { font-size: 16px; width: 20px; text-align: center; }
  .nav-item:hover { background: var(--sidebar-hover); color: #fff; }
  .nav-item.active { background: var(--accent); color: #fff; }

  .sidebar-footer { padding: 14px 12px 18px; border-top: 1px solid rgba(244,241,234,0.1); }
  .sidebar-footer .nav-item { color: rgba(244,241,234,0.55); }

  .sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 150;
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--sidebar);
    color: #fff;
    border: none;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  }
  .sidebar-scrim {
    display: none;
    position: fixed; inset: 0; z-index: 90;
    background: rgba(0,0,0,0.4);
  }

  main {
    flex: 1;
    margin-left: 240px;
    padding: 28px 32px 80px;
    max-width: 1400px;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 16px;
    margin-bottom: 22px;
  }
  .topbar h1 { font-size: 26px; }
  .topbar .sub { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
  .topbar-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background .2s ease, border-color .2s ease, transform .15s ease;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(187,90,52,0.28); }
  .btn.primary:hover { transform: translateY(-1px); }
  .btn.danger { color: var(--red); }
  .btn.danger:hover { border-color: var(--red); background: #fdecea; }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .toolbar input, .toolbar select {
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13.5px;
    background: var(--card);
  }
  .toolbar input { flex: 1 1 220px; min-width: 0; }

  /* ── Dashboard stat cards ── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 8px 24px rgba(38,34,28,0.06);
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--accent-color, var(--accent));
  }
  .stat-card .ic { font-size: 22px; margin-bottom: 10px; display: block; }
  .stat-card .num { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; }
  .stat-card .label { font-size: 12.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }

  .section-title { font-size: 18px; font-family: 'Playfair Display', serif; margin: 32px 0 14px; }

  .stat-pills { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat-pill {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .stat-pill b { color: var(--ink); }

  .table-wrap {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow-x: auto;
    box-shadow: 0 8px 24px rgba(38,34,28,0.06);
  }
  table { width: 100%; border-collapse: collapse; min-width: 700px; }
  thead th {
    text-align: left;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
    vertical-align: top;
    max-width: 240px;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(187,90,52,0.04); }
  td.primary-col { font-weight: 600; }
  td.actions { white-space: nowrap; }
  td.actions .btn { padding: 6px 10px; font-size: 12px; margin-right: 6px; }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: #fff;
    white-space: nowrap;
  }
  .badge.New, .badge.Pending { background: var(--accent); }
  .badge.Contacted, .badge.Partial { background: var(--gold); }
  .badge.Booked, .badge.Paid { background: var(--jade); }
  .badge.Closed { background: #8b8478; }

  .empty, .loading, .error-msg {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .error-msg { color: var(--red); }

  .activity-list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 8px 24px rgba(38,34,28,0.06); }
  .activity-row { display: flex; justify-content: space-between; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .activity-row:last-child { border-bottom: none; }
  .activity-row .who { font-weight: 600; }
  .activity-row .when { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }

  /* ── Modal ── */
  #modal-backdrop {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(38,34,28,0.5);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  #modal-backdrop.visible { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 16px;
    padding: 28px;
    max-width: 460px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 20px; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  .date-range-wrap { display: flex; align-items: center; gap: 8px; }
  .date-range-wrap input[type="date"] {
    flex: 1 1 0;
    min-width: 0;
  }
  .date-range-sep { color: var(--ink-soft); font-size: 13px; flex-shrink: 0; }
  .date-range-labels { display: flex; gap: 8px; margin-bottom: 4px; }
  .date-range-labels span {
    flex: 1 1 0;
    font-size: 10.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: .03em;
  }

  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-toggle { display: flex; align-items: center; justify-content: center; }
    .sidebar-scrim.open { display: block; }
    main { margin-left: 0; padding: 76px 16px 60px; }
  }
  @media (max-width: 480px) {
    .topbar h1 { font-size: 22px; }
    .stat-card .num { font-size: 26px; }
  }
</style>
</head>
<body>

<!-- Login gate -->
<div id="gate">
  <div class="gate-box">
    <a href="index.html" aria-label="Go to homepage"><img class="gate-logo" src="images/Logo.png" alt="Viharasetu logo" /></a>
    <h1>Admin Portal</h1>
    <p>Log in to manage enquiries, suppliers, and bookings.</p>
    <input type="text" id="gate-username" placeholder="Username" autocomplete="off" />
    <div class="gate-pw-wrap">
      <input type="password" id="gate-password" placeholder="Password" autocomplete="off" />
      <button type="button" class="gate-pw-toggle" id="gate-pw-toggle" aria-label="Show password">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" id="gate-pw-icon">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
        </svg>
      </button>
    </div>
    <button id="gate-submit">Log in</button>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>

<!-- App shell -->
<button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle menu">☰</button>
<div class="sidebar-scrim" id="sidebar-scrim"></div>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="images/Logo.png" alt="Viharasetu logo" />
      <div>
        <div class="name">Viharasetu</div>
        <div class="sub">Admin Portal</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item" data-view="dashboard"><span class="ic">◈</span> Dashboard</div>
      <div class="nav-item" data-view="enquiries"><span class="ic">✉</span> Enquiries</div>
      <div class="nav-item" data-view="suppliers"><span class="ic">🤝</span> Suppliers</div>
      <div class="nav-item" data-view="bookings"><span class="ic">🧳</span> Bookings</div>
      <div class="nav-item" data-view="profile"><span class="ic">👤</span> Profile</div>
    </nav>
    <div class="sidebar-footer">
      <a class="nav-item" href="index.html"><span class="ic">⌂</span> Home page</a>
      <div class="nav-item" id="logout-btn"><span class="ic">⏻</span> Log out</div>
    </div>
  </aside>

  <main id="main"></main>
</div>

<!-- Add/Edit modal -->
<div id="modal-backdrop">
  <div class="modal">
    <h2 id="modal-title">Edit</h2>
    <div id="modal-fields"></div>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel">Cancel</button>
      <button class="btn primary" id="modal-save">Save</button>
    </div>
  </div>
</div>

<script>
// ── Configuration ─────────────────────────────────────────────
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby16uHDPLkWFMHOQtKH3ggej7MnRNW4Lfrn5RPrLkNpN-6Vj8aFitTBHjgvIqi1qaDQzA/exec";

// CHANGE THESE before you rely on it — this is a basic deterrent only, not real security
// (anyone can view this file's source and read the usernames/passwords). Do not store
// sensitive data in the sheet if that's a concern.
// canDelete: false hides the Delete button for that user — they can still add and edit.
const USERS = [
  { username: "admin", password: "Viharasetu@2026", canDelete: true },
  { username: "sirishakandala", password: "sirisha@kandala", canDelete: false },
  { username: "maniraj1995", password: "Maniraju@111", canDelete: true }
];

let currentUser = null;

// Profile edits (password/mobile/email) are saved in this browser's localStorage,
// keyed by username, and layered on top of the USERS list above. This means a
// changed password takes effect immediately without editing this file — but only
// on this same browser/device, since there's no real backend for accounts.
const PROFILE_STORAGE_KEY = 'vh_admin_profiles';

function loadProfileOverrides() {
  try {
    return JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY) || '{}');
  } catch (e) {
    return {};
  }
}

function saveProfileOverride(username, data) {
  const all = loadProfileOverrides();
  all[username] = Object.assign({}, all[username], data);
  localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(all));
}

function getEffectiveUsers() {
  const overrides = loadProfileOverrides();
  return USERS.map(u => Object.assign({}, u, overrides[u.username] || {}));
}

// Downloads a plain-text snapshot of every account's current username/password
// (and mobile/email, if set) as a backup you can keep for reference if you
// forget a password. Browsers can't silently overwrite a fixed file on disk,
// so each call downloads a fresh file — your browser will add "(1)", "(2)"
// etc. to the filename if one from an earlier save is still in Downloads.
function downloadCredentialsBackup() {
  const users = getEffectiveUsers();
  const now = new Date();
  const lines = [
    'Viharasetu Admin Portal — login backup',
    'Generated: ' + now.toLocaleString('en-IN'),
    'Keep this file somewhere private — it contains live passwords.',
    ''
  ];
  users.forEach(u => {
    lines.push('Username: ' + u.username);
    lines.push('Password: ' + u.password);
    if (u.mobile) lines.push('Mobile: ' + u.mobile);
    if (u.email) lines.push('Email: ' + u.email);
    lines.push('Can delete entries: ' + (u.canDelete ? 'Yes' : 'No'));
    lines.push('');
  });

  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'viharasetu-admin-credentials.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Per-sheet display config: which column drives the colored badge and its options,
// which column is a long-text field, and the primary (bold) column in the table.
const SHEET_CONFIG = {
  enquiries: {
    label: 'Enquiries', icon: '✉', accent: '#BB5A34',
    primaryCol: 'Name',
    badgeCol: 'Status', badgeOptions: ['New', 'Contacted', 'Booked', 'Closed'],
    textareaCols: [],
    searchCols: ['Name', 'Email', 'Phone', 'Destination']
  },
  suppliers: {
    label: 'Suppliers', icon: '🤝', accent: '#2A5C45',
    primaryCol: 'Supplier Company Name',
    badgeCol: null, badgeOptions: [],
    textareaCols: [],
    searchCols: ['Supplier Company Name', 'Supplier Name', 'States', 'Contact No', 'Supplier ID']
  },
  bookings: {
    label: 'Bookings', icon: '🧳', accent: '#B8913F',
    primaryCol: 'Customer',
    badgeCol: 'Payment Status', badgeOptions: ['Pending', 'Partial', 'Paid'],
    textareaCols: ['Notes'],
    searchCols: ['Customer', 'Package', 'Travel Dates']
  }
};

// ── Login gate ─────────────────────────────────────────────
const gate = document.getElementById('gate');
const app = document.getElementById('app');
const gateUsername = document.getElementById('gate-username');
const gatePassword = document.getElementById('gate-password');
const gateError = document.getElementById('gate-error');

const EYE_ICON = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>';
const EYE_OFF_ICON = '<path d="M3 3l18 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M10.6 5.2A11.4 11.4 0 0 1 12 5c7 0 11 7 11 7a13.5 13.5 0 0 1-3.4 4.1M6.7 6.7C3.7 8.6 1 12 1 12s4 7 11 7a10.8 10.8 0 0 0 4.2-.85" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>';

document.getElementById('gate-pw-toggle').addEventListener('click', () => {
  const showing = gatePassword.type === 'text';
  gatePassword.type = showing ? 'password' : 'text';
  document.getElementById('gate-pw-icon').innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
  document.getElementById('gate-pw-toggle').setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
});

function unlock() {
  gate.classList.add('hidden');
  app.classList.add('visible');
  navigate('dashboard');
}

function lock() {
  gate.classList.remove('hidden');
  app.classList.remove('visible');
  gateUsername.value = '';
  gatePassword.value = '';
  gateError.textContent = '';
  currentUser = null;
}

// No persistence at all, on purpose: refreshing the page, clicking "Log out",
// or navigating away and pressing Back must all land back on the login gate.
document.getElementById('gate-submit').addEventListener('click', tryUnlock);
gateUsername.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
gatePassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

function tryUnlock() {
  const match = getEffectiveUsers().find(u => u.username === gateUsername.value && u.password === gatePassword.value);
  if (match) {
    currentUser = match;
    gateError.textContent = '';
    unlock();
  } else {
    gateError.textContent = 'Incorrect username or password.';
  }
}

document.getElementById('logout-btn').addEventListener('click', lock);

// If the browser restores this page from its back/forward cache (e.g. the user
// clicked "Home page" then pressed Back), the page's JS doesn't re-run — it
// just repaints whatever was on screen when they left. Force the login gate
// back up in that case too.
window.addEventListener('pageshow', (event) => {
  if (event.persisted) lock();
});

// ── Sidebar (mobile) ─────────────────────────────────────────
const sidebar = document.getElementById('sidebar');
const sidebarScrim = document.getElementById('sidebar-scrim');
document.getElementById('sidebar-toggle').addEventListener('click', () => {
  sidebar.classList.add('open');
  sidebarScrim.classList.add('open');
});
sidebarScrim.addEventListener('click', closeSidebar);
function closeSidebar() {
  sidebar.classList.remove('open');
  sidebarScrim.classList.remove('open');
}

document.querySelectorAll('.nav-item[data-view]').forEach(el => {
  el.addEventListener('click', () => { navigate(el.dataset.view); closeSidebar(); });
});

// ── Data cache ─────────────────────────────────────────────
const cache = {}; // { enquiries: {headers, rows}, suppliers: {...}, bookings: {...} }
let currentView = 'dashboard';

async function fetchSheet(key, force) {
  if (cache[key] && !force) return cache[key];
  const res = await fetch(SCRIPT_URL + '?sheet=' + key, { method: 'GET' });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Unknown error');
  cache[key] = { headers: data.headers, rows: data.rows };
  return cache[key];
}

function navigate(view) {
  currentView = view;
  document.querySelectorAll('.nav-item[data-view]').forEach(el => {
    el.classList.toggle('active', el.dataset.view === view);
  });
  if (view === 'dashboard') renderDashboard();
  else if (view === 'profile') renderProfile();
  else renderSheetView(view);
}

// ── Dashboard ─────────────────────────────────────────────
async function renderDashboard() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="topbar">
      <div><h1>Dashboard</h1><div class="sub">Overview across all three sheets.</div></div>
      <div class="topbar-actions"><button class="btn" id="dash-refresh">↻ Refresh</button></div>
    </div>
    <div class="loading">Loading dashboard…</div>
  `;
  document.getElementById('dash-refresh').addEventListener('click', () => { cache.enquiries = cache.suppliers = cache.bookings = null; renderDashboard(); });

  try {
    const [enq, sup, book] = await Promise.all([
      fetchSheet('enquiries'), fetchSheet('suppliers'), fetchSheet('bookings')
    ]);
    if (currentView !== 'dashboard') return; // user navigated away before this resolved
    const newEnq = enq.rows.filter(r => r['Status'] === 'New').length;
    const totalAmount = book.rows.reduce((sum, r) => sum + (parseFloat(r['Amount']) || 0), 0);
    const recent = enq.rows.slice().sort((a, b) => b.rowIndex - a.rowIndex).slice(0, 5);

    const body = document.getElementById('main');
    body.querySelector('.loading')?.remove();
    const statGrid = document.createElement('div');
    statGrid.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card" style="--accent-color:#BB5A34">
          <span class="ic">✉</span>
          <div class="num">${enq.rows.length}</div>
          <div class="label">Total Enquiries</div>
        </div>
        <div class="stat-card" style="--accent-color:#9C4826">
          <span class="ic">🆕</span>
          <div class="num">${newEnq}</div>
          <div class="label">New Enquiries</div>
        </div>
        <div class="stat-card" style="--accent-color:#2A5C45">
          <span class="ic">🤝</span>
          <div class="num">${sup.rows.length}</div>
          <div class="label">Suppliers</div>
        </div>
        <div class="stat-card" style="--accent-color:#B8913F">
          <span class="ic">🧳</span>
          <div class="num">${book.rows.length}</div>
          <div class="label">Bookings</div>
        </div>
        <div class="stat-card" style="--accent-color:#B8913F">
          <span class="ic">₹</span>
          <div class="num">₹${totalAmount.toLocaleString('en-IN')}</div>
          <div class="label">Total Booking Value</div>
        </div>
      </div>
      <div class="section-title">Recent Enquiries</div>
      <div class="activity-list" id="recent-list"></div>
    `;
    main.innerHTML = '';
    main.appendChild(topbarEl('Dashboard', 'Overview across all three sheets.', [{ id: 'dash-refresh2', label: '↻ Refresh' }]));
    main.appendChild(statGrid);
    document.getElementById('dash-refresh2').addEventListener('click', () => { cache.enquiries = cache.suppliers = cache.bookings = null; renderDashboard(); });

    const list = document.getElementById('recent-list');
    if (recent.length === 0) {
      list.innerHTML = '<div class="empty">No enquiries yet.</div>';
    } else {
      list.innerHTML = recent.map(r => `
        <div class="activity-row">
          <div>
            <div class="who">${escapeHtml(r['Name'])}</div>
            <div style="color:var(--ink-soft)">${escapeHtml(r['Destination'])}</div>
          </div>
          <div style="text-align:right">
            <span class="badge ${escapeHtml(r['Status'])}">${escapeHtml(r['Status'])}</span>
            <div class="when">${formatDate(r['Timestamp'])}</div>
          </div>
        </div>
      `).join('');
    }
  } catch (err) {
    main.innerHTML = `<div class="error-msg">Couldn't load dashboard. Check that the Apps Script is deployed and SCRIPT_URL is correct.<br>(${escapeHtml(String(err.message || err))})</div>`;
  }
}

function topbarEl(title, sub, buttons) {
  const div = document.createElement('div');
  div.className = 'topbar';
  div.innerHTML = `
    <div><h1>${title}</h1><div class="sub">${sub}</div></div>
    <div class="topbar-actions">${buttons.map(b => `<button class="btn ${b.cls || ''}" id="${b.id}">${b.label}</button>`).join('')}</div>
  `;
  return div;
}

// ── Profile (change password, mobile, email) ─────────────────
function renderProfile() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  main.appendChild(topbarEl('Profile', 'Update your contact details or change your password.', []));

  const card = document.createElement('div');
  card.className = 'table-wrap';
  card.style.padding = '28px';
  card.style.maxWidth = '480px';
  card.innerHTML = `
    <div class="field"><label>Username</label><input type="text" value="${escapeAttr(currentUser.username)}" disabled /></div>
    <div class="field"><label>Mobile Number</label><input type="tel" id="profile-mobile" value="${escapeAttr(currentUser.mobile || '')}" placeholder="e.g. 98765 43210" /></div>
    <div class="field"><label>Email</label><input type="email" id="profile-email" value="${escapeAttr(currentUser.email || '')}" placeholder="you@example.com" /></div>
    <div class="section-title" style="margin:24px 0 14px;">Change Password</div>
    <div class="field"><label>Current Password</label><input type="password" id="profile-current-pw" autocomplete="off" /></div>
    <div class="field"><label>New Password</label><input type="password" id="profile-new-pw" autocomplete="off" /></div>
    <div class="field"><label>Confirm New Password</label><input type="password" id="profile-confirm-pw" autocomplete="off" /></div>
    <div id="profile-msg" style="font-size:13px;margin-top:4px;min-height:18px;"></div>
    <div class="modal-actions" style="justify-content:flex-start;margin-top:12px;">
      <button class="btn primary" id="profile-save">Save Changes</button>
      <button class="btn" id="profile-download-backup">⬇ Download login backup (.txt)</button>
    </div>
  `;
  main.appendChild(card);

  document.getElementById('profile-save').addEventListener('click', saveProfile);
  document.getElementById('profile-download-backup').addEventListener('click', downloadCredentialsBackup);
}

function saveProfile() {
  const msg = document.getElementById('profile-msg');
  const mobile = document.getElementById('profile-mobile').value.trim();
  const email = document.getElementById('profile-email').value.trim();
  const currentPw = document.getElementById('profile-current-pw').value;
  const newPw = document.getElementById('profile-new-pw').value;
  const confirmPw = document.getElementById('profile-confirm-pw').value;

  const updates = { mobile, email };

  if (currentPw || newPw || confirmPw) {
    if (currentPw !== currentUser.password) {
      msg.style.color = 'var(--red)';
      msg.textContent = 'Current password is incorrect.';
      return;
    }
    if (!newPw || newPw.length < 6) {
      msg.style.color = 'var(--red)';
      msg.textContent = 'New password must be at least 6 characters.';
      return;
    }
    if (newPw !== confirmPw) {
      msg.style.color = 'var(--red)';
      msg.textContent = 'New password and confirmation do not match.';
      return;
    }
    updates.password = newPw;
  }

  saveProfileOverride(currentUser.username, updates);
  currentUser = Object.assign({}, currentUser, updates);

  if (updates.password) {
    downloadCredentialsBackup();
    msg.style.color = 'var(--jade)';
    msg.textContent = 'Saved — a login backup file was downloaded.';
  } else {
    msg.style.color = 'var(--jade)';
    msg.textContent = 'Saved.';
  }
  document.getElementById('profile-current-pw').value = '';
  document.getElementById('profile-new-pw').value = '';
  document.getElementById('profile-confirm-pw').value = '';
}

// ── Generic sheet view (table + search + add/edit/delete) ─────
async function renderSheetView(key) {
  const cfg = SHEET_CONFIG[key];
  const main = document.getElementById('main');
  main.innerHTML = '';
  main.appendChild(topbarEl(cfg.label, 'Live from your Google Sheet — add, edit, or remove entries here.', [
    { id: 'add-btn', label: '+ Add New', cls: 'primary' },
    { id: 'refresh-btn', label: '↻ Refresh' }
  ]));

  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';
  toolbar.innerHTML = `
    <input type="text" id="search-input" placeholder="Search ${cfg.searchCols.join(', ').toLowerCase()}..." />
    ${cfg.badgeCol ? `<select id="badge-filter"><option value="">All ${cfg.badgeCol.toLowerCase()}</option>${cfg.badgeOptions.map(o => `<option value="${o}">${o}</option>`).join('')}</select>` : ''}
  `;
  main.appendChild(toolbar);

  if (cfg.badgeCol) {
    const pills = document.createElement('div');
    pills.className = 'stat-pills';
    pills.id = 'stat-pills';
    main.appendChild(pills);
  }

  const tableWrap = document.createElement('div');
  tableWrap.className = 'table-wrap';
  tableWrap.innerHTML = '<div class="loading">Loading…</div>';
  main.appendChild(tableWrap);

  const addBtn = document.getElementById('add-btn');
  addBtn.disabled = true;
  addBtn.addEventListener('click', () => openModal(key, null));
  document.getElementById('refresh-btn').addEventListener('click', () => loadAndRenderSheet(key, true));
  document.getElementById('search-input').addEventListener('input', () => renderSheetTable(key));
  const badgeFilter = document.getElementById('badge-filter');
  if (badgeFilter) badgeFilter.addEventListener('change', () => renderSheetTable(key));

  loadAndRenderSheet(key, false);
}

async function loadAndRenderSheet(key, force) {
  const tableWrap = document.querySelector('.table-wrap');
  if (tableWrap) tableWrap.innerHTML = '<div class="loading">Loading…</div>';
  try {
    await fetchSheet(key, force);
    if (currentView === key) {
      const addBtn = document.getElementById('add-btn');
      if (addBtn) addBtn.disabled = false;
    }
    renderSheetTable(key);
  } catch (err) {
    if (tableWrap) tableWrap.innerHTML = `<div class="error-msg">Couldn't load data. Check that the Apps Script is deployed and SCRIPT_URL is correct.<br>(${escapeHtml(String(err.message || err))})</div>`;
  }
}

function renderSheetTable(key) {
  if (currentView !== key) return;
  const cfg = SHEET_CONFIG[key];
  const { headers, rows } = cache[key];
  const tableWrap = document.querySelector('.table-wrap');
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  const badgeFilter = document.getElementById('badge-filter')?.value || '';

  if (cfg.badgeCol) {
    const counts = {};
    cfg.badgeOptions.forEach(o => counts[o] = 0);
    rows.forEach(r => { counts[r[cfg.badgeCol]] = (counts[r[cfg.badgeCol]] || 0) + 1; });
    const pills = document.getElementById('stat-pills');
    if (pills) {
      pills.innerHTML = `<div class="stat-pill"><b>${rows.length}</b> total</div>` +
        cfg.badgeOptions.map(o => `<div class="stat-pill"><b>${counts[o] || 0}</b> ${o.toLowerCase()}</div>`).join('');
    }
  }

  let filtered = rows.slice().sort((a, b) => b.rowIndex - a.rowIndex);
  if (badgeFilter) filtered = filtered.filter(r => r[cfg.badgeCol] === badgeFilter);
  if (q) {
    filtered = filtered.filter(r => cfg.searchCols.map(c => String(r[c] || '')).join(' ').toLowerCase().includes(q));
  }

  if (filtered.length === 0) {
    tableWrap.innerHTML = '<div class="empty">No entries match.</div>';
    return;
  }

  const displayHeaders = headers; // Timestamp included, formatted below
  const bodyRows = filtered.map(r => {
    const cells = displayHeaders.map(h => {
      if (h === 'Timestamp') return `<td>${formatDate(r[h])}</td>`;
      if (h === cfg.badgeCol) return `<td><span class="badge ${escapeHtml(r[h])}">${escapeHtml(r[h])}</span></td>`;
      const cls = h === cfg.primaryCol ? ' class="primary-col"' : '';
      return `<td${cls}>${escapeHtml(r[h])}</td>`;
    }).join('');
    return `
      <tr>
        ${cells}
        <td class="actions">
          <button class="btn edit-btn" data-row="${r.rowIndex}">Edit</button>
          ${currentUser.canDelete ? `<button class="btn danger delete-btn" data-row="${r.rowIndex}">Delete</button>` : ''}
        </td>
      </tr>
    `;
  }).join('');

  tableWrap.innerHTML = `
    <table>
      <thead><tr>${displayHeaders.map(h => `<th>${h}</th>`).join('')}<th>Actions</th></tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
  `;

  tableWrap.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openModal(key, parseInt(btn.dataset.row, 10)));
  });
  tableWrap.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => confirmDelete(key, parseInt(btn.dataset.row, 10)));
  });
}

// ── Add/Edit modal (generic, driven by headers) ─────────────────
const modalBackdrop = document.getElementById('modal-backdrop');
let modalState = { key: null, rowIndex: null };

function openModal(key, rowIndex) {
  const cfg = SHEET_CONFIG[key];
  if (!cache[key]) return; // data hasn't loaded yet; add-btn is disabled until it has
  const { headers, rows } = cache[key];
  const row = rowIndex ? rows.find(r => r.rowIndex === rowIndex) : null;
  modalState = { key, rowIndex };

  document.getElementById('modal-title').textContent = (row ? 'Edit ' : 'Add New ') + cfg.label.replace(/s$/, '');

  const fieldsHost = document.getElementById('modal-fields');
  fieldsHost.innerHTML = headers.map(h => {
    if (h === 'Timestamp') return '';
    const val = row ? (row[h] || '') : '';
    if (h === cfg.badgeCol) {
      return `<div class="field"><label>${h}</label><select data-field="${escapeAttr(h)}">${cfg.badgeOptions.map(o => `<option ${o === val ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;
    }
    if (cfg.textareaCols.includes(h)) {
      return `<div class="field"><label>${h}</label><textarea data-field="${escapeAttr(h)}">${escapeHtml(val)}</textarea></div>`;
    }
    if (/date/i.test(h)) {
      const [startIso, endIso] = parseDateRange(val);
      return `<div class="field"><label>${h}</label>
        <div class="date-range-labels"><span>Start date</span><span>End date</span></div>
        <div class="date-range-wrap">
          <input type="date" class="date-range-start" value="${startIso || ''}" />
          <span class="date-range-sep">–</span>
          <input type="date" class="date-range-end" value="${endIso || ''}" />
        </div>
        <input type="hidden" data-field="${escapeAttr(h)}" value="${escapeAttr(val)}" />
      </div>`;
    }
    const inputType = /email/i.test(h) ? 'email' : (/phone|contact/i.test(h) ? 'tel' : (/amount|pax/i.test(h) ? 'number' : 'text'));
    return `<div class="field"><label>${h}</label><input type="${inputType}" data-field="${escapeAttr(h)}" value="${escapeAttr(val)}" /></div>`;
  }).join('');

  fieldsHost.querySelectorAll('.date-range-wrap').forEach(wrap => {
    const startInput = wrap.querySelector('.date-range-start');
    const endInput = wrap.querySelector('.date-range-end');
    const hiddenField = wrap.parentElement.querySelector('input[type="hidden"][data-field]');

    function syncHiddenField() {
      // If the end date ends up earlier than the start date, swap them rather
      // than saving a nonsensical range.
      if (startInput.value && endInput.value && endInput.value < startInput.value) {
        const tmp = startInput.value;
        startInput.value = endInput.value;
        endInput.value = tmp;
      }
      const startFmt = startInput.value ? formatDateInput(startInput.value) : '';
      const endFmt = endInput.value ? formatDateInput(endInput.value) : '';
      hiddenField.value = startFmt && endFmt ? `${startFmt} – ${endFmt}` : (startFmt || endFmt || '');
    }

    startInput.addEventListener('change', syncHiddenField);
    endInput.addEventListener('change', syncHiddenField);
  });

  modalBackdrop.classList.add('visible');
}

function formatDateInput(isoDate) {
  const [y, m, d] = isoDate.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

// Best-effort parse of an existing "Travel Dates"-style string back into two
// ISO (YYYY-MM-DD) dates so the two pickers can be pre-filled when editing.
// Falls back to empty pickers (not a crash) for formats it can't recognize.
function parseDateRange(text) {
  if (!text) return [null, null];
  const parts = text.split(/\s*[–—]\s*/).map(s => s.trim()).filter(Boolean);
  const toIso = (s) => {
    const d = new Date(s);
    if (isNaN(d.getTime())) return null;
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };
  if (parts.length >= 2) return [toIso(parts[0]), toIso(parts[parts.length - 1])];
  if (parts.length === 1) return [toIso(parts[0]), null];
  return [null, null];
}

document.getElementById('modal-cancel').addEventListener('click', () => {
  modalBackdrop.classList.remove('visible');
  modalState = { key: null, rowIndex: null };
});

document.getElementById('modal-save').addEventListener('click', async () => {
  const { key, rowIndex } = modalState;
  if (!key) return;
  const saveBtn = document.getElementById('modal-save');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';
  try {
    const values = {};
    document.querySelectorAll('#modal-fields [data-field]').forEach(el => {
      values[el.dataset.field] = el.value;
    });
    await postAction({
      sheet: key,
      action: rowIndex ? 'update' : 'create',
      rowIndex: rowIndex || undefined,
      values: values
    });
    modalBackdrop.classList.remove('visible');
    modalState = { key: null, rowIndex: null };
    await loadAndRenderSheet(key, true);
  } catch (err) {
    alert('Failed to save: ' + err.message);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save';
  }
});

function confirmDelete(key, rowIndex) {
  if (!currentUser.canDelete) return; // this account isn't permitted to delete entries
  const cfg = SHEET_CONFIG[key];
  const row = cache[key].rows.find(r => r.rowIndex === rowIndex);
  if (!row) return;
  const label = row[cfg.primaryCol] || 'this entry';
  if (!confirm(`Delete "${label}"? This can't be undone.`)) return;
  postAction({ sheet: key, action: 'delete', rowIndex: rowIndex })
    .then(() => loadAndRenderSheet(key, true))
    .catch(err => alert('Failed to delete: ' + err.message));
}

// Sent as text/plain on purpose: a JSON Content-Type header triggers a CORS
// preflight (OPTIONS) request that Apps Script web apps don't handle, which
// silently breaks the request. Apps Script reads the raw body regardless of
// the declared content type, so this still parses fine server-side.
function postAction(payload) {
  return fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(res => res.json()).then(data => {
    if (!data.ok) throw new Error(data.error || 'Unknown error');
    return data;
  });
}

// ── Utils ─────────────────────────────────────────────
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) +
    ' ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escapeAttr(s) { return escapeHtml(s).replace(/'/g, '&#39;'); }
